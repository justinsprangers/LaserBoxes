<title>LaserBoxes: free laser-cut box generators</title>
<meta name="description" content="Free, offline parametric generators for laser-cut boxes, trays, drawers and joints. Set your sizes, check the 3D view and fit check, download SVG or DXF.">

<script src="generators/lid-box.js"></script>

<script src="generators/hinge-box.js"></script>

<script src="generators/divider-tray.js"></script>
<script src="generators/polygon-box.js"></script>
<script src="generators/drawer.js"></script>
<script src="generators/stackable-bin.js"></script>
<script src="generators/shelf.js"></script>
<script src="generators/flex-box.js"></script>
<script src="generators/gears.js"></script>
<script src="generators/hook-joint.js"></script>
<script src="generators/plate.js"></script>
<script src="generators/living-hinge.js"></script>
<!-- repo: link for "Source" and "Report a problem"; change it if the GitHub repo name differs -->
<script>LB.start({repo:'https://github.com/justinsprangers/LaserBoxes'});</script>
